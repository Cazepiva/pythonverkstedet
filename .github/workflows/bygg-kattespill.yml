name: Bygg kattespill

on:
  workflow_dispatch:
  push:
    paths:
      - "kattespill/**"
      - ".github/workflows/bygg-kattespill.yml"

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest

    steps:
      - name: Hent filene
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pygbag
        run: python -m pip install pygbag

      - name: Bygg kattespillet
        run: python -m pygbag --build kattespill
      - 
        name: Lagre spillfilene
        uses: actions/upload-artifact@v4
        with:
          name: kattespill-nettside
          path: kattespill/build/web/
          if-no-files-found: error
  
