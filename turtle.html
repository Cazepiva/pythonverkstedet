
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐢 Turtle-verkstedet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f7ff;
      color: #24324a;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 900px;
      margin: auto;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin: 20px 0;
    }
    textarea {
      width: 100%;
      height: 200px;
      box-sizing: border-box;
      padding: 14px;
      font-family: monospace;
      font-size: 16px;
    }
    canvas {
      width: 100%;
      max-width: 600px;
      background: white;
      border: 2px solid #3657a5;
      border-radius: 10px;
    }
    button {
      background: #27834a;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>🐢 Turtle-verkstedet</h1>
    <p>Lær Python ved å tegne med en skilpadde!</p>

    <section class="panel">
      <h2>💻 Min Turtle-kode</h2>
      <p>Snart kan du skrive Python-kode her og tegne figurer.</p>

      <textarea id="turtle-code" spellcheck="false">from turtle import *

for i in range(4):
    forward(100)
    right(90)</textarea>

      <p><button id="run-turtle">▶ Tegn med Turtle</button></p>
    </section>

    <section class="panel">
      <h2>🎨 Tegnefelt</h2>
      <canvas id="turtle-canvas" width="600" height="400"></canvas>
      <p id="turtle-status">Klar til å tegne!</p>
    </section>

    <p><a href="index.html">← Tilbake til Pythonverkstedet</a></p>
  </main>
<script>
  const canvas = document.getElementById("turtle-canvas");
  const ctx = canvas.getContext("2d");
  const status = document.getElementById("turtle-status");
  const codeBox = document.getElementById("turtle-code");
  codeBox.addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;

  const start = codeBox.selectionStart;
  const end = codeBox.selectionEnd;
  const text = codeBox.value;
  const lineStart = text.lastIndexOf("\n", start - 1) + 1;
  const currentLine = text.slice(lineStart, start);
  const spaces = currentLine.match(/^\s*/)[0];
  const indent = spaces + (currentLine.trimEnd().endsWith(":") ? "    " : "");

  event.preventDefault();

  const insertion = "\n" + indent;
  codeBox.value = text.slice(0, start) + insertion + text.slice(end);
  codeBox.selectionStart = codeBox.selectionEnd = start + insertion.length;
});
  const runButton = document.getElementById("run-turtle");
  let x = canvas.width / 2;
let y = canvas.height / 2;
let angle = 0;
let penDown = true;

function forward(distance) {
  const radians = angle * Math.PI / 180;
  const newX = x + Math.cos(radians) * distance;
  const newY = y - Math.sin(radians) * distance;

  if (penDown) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(newX, newY);
    ctx.stroke();
  }

  x = newX;
  y = newY;
}

function right(degrees) {
  angle -= degrees;
}

function left(degrees) {
  angle += degrees;
}
  function resetTurtle() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  x = canvas.width / 2;
  y = canvas.height / 2;
  angle = 0;
  penDown = true;
  ctx.strokeStyle = "black";
  ctx.lineWidth = 2;
}
  runButton.onclick = () => {
  resetTurtle();

  const pythonCode = codeBox.value;
    const lines = pythonCode.split("\n");
    const loopPattern = /^for\s+\w+\s+in\s+range\((\d+)\):$/;
    let repeatCount = 1;
    let loopCommands = [];
for (const line of lines) {
  const command = line.trim();
  const isIndented = line.startsWith("    ");
  const loopMatch = command.match(loopPattern);
  if (loopMatch) {
  repeatCount = Number(loopMatch[1]);
  continue;
}
  if (isIndented && repeatCount > 1) {
  loopCommands.push(command);
  continue;
}
  const match = command.match(/^forward\((\d+)\)$/);

if (match) {
 for (let i = 0; i < (isIndented ? repeatCount : 1); i++) {
  forward(Number(match[1]));
}
}
  const rightMatch = command.match(/^right\((\d+)\)$/);

if (rightMatch) {
  for (let i = 0; i < (isIndented ? repeatCount : 1); i++) {
  right(Number(rightMatch[1]));
}
}
  const leftMatch = command.match(/^left\((\d+)\)$/);

if (leftMatch) {
  for (let i = 0; i < (isIndented ? repeatCount : 1); i++) {
  left(Number(leftMatch[1]));
}
}
}
 for (let i = 0; i < repeatCount; i++) {
  for (const command of loopCommands) {
    const forwardMatch = command.match(/^forward\((\d+)\)$/);
    const rightMatch = command.match(/^right\((\d+)\)$/);
    const leftMatch = command.match(/^left\((\d+)\)$/);

    if (forwardMatch) forward(Number(forwardMatch[1]));
    if (rightMatch) right(Number(rightMatch[1]));
    if (leftMatch) left(Number(leftMatch[1]));
  }
}   
  status.textContent = "Ferdig! Tegningen er klar.";
};
</script>
</body>
</html>
